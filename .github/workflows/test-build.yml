name: Lint and Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Daily, so a suite that rots without a code change (pinned dates, upstream
  # releases) turns red within 24h instead of at the next push.
  schedule:
    - cron: "0 21 * * *"  # 06:00 JST

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --locked

    - name: Run Ruff (lint)
      run: uv run ruff check .

    - name: Run Ruff (format check)
      run: uv run ruff format --check .

    - name: Run ty (type check)
      run: uv run ty check .

    - name: Run tests
      run: uv run pytest

    - name: Audit dependencies
      # Non-blocking on purpose: a permanently-red check protects nothing.
      # Read this step's output during reviews.
      run: |
        uv export --no-hashes --no-emit-project --format requirements-txt -o /tmp/req_audit.txt
        uv tool run pip-audit -r /tmp/req_audit.txt --no-deps || true
